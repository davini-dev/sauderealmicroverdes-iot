# ════════════════════════════════════════════════════════════════
#  🌱 Saúde Real Microverdes IoT — Docker Compose
#
#  3 serviços:
#    1. server      — Node.js aggregator + HTTP API (porta 3000)
#    2. mcp         — MCP Server para agentes de IA (stdio)
#    3. greenhouse  — React dashboard via Nginx (porta 8080)
#
#  Broker MQTT padrão: ThingsBoard via Gateway-MQTT
#  Infra: VPS do Instituto Saúde Real na Hetzner (Alemanha)
#
#  Uso:
#    docker compose up -d          # subir tudo
#    docker compose up -d --build  # reconstruir imagens
#    docker compose logs -f server # ver logs do server
#    docker compose down           # parar tudo
#
#  Acesso:
#    Dashboard:    http://localhost:8080
#    Server API:   http://localhost:3000/status
#    MCP Server:   docker compose -f docker-compose.yml run mcp
#    MQTT Broker:  ThingsBoard via Gateway-MQTT (padrão)
#
#  ════════════════════════════════════════════════════════════════

x-common-logging: &common-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  microverdes:
    driver: bridge
    name: microverdes

services:

  # ════════════════════════════════════════════════════════
  #  1. Server — MQTT Aggregator + HTTP API
  #  Conecta no broker padrão do ThingsBoard/Gateway-MQTT
  # ════════════════════════════════════════════════════════
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: microverdes-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MQTT_BROKER_URL: 49.13.124.109
      MQTT_BROKER_PORT: 1883
    ports:
      - "3000:3000"
    networks:
      - microverdes
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *common-logging

  # ════════════════════════════════════════════════════════
  #  2. MCP Server — Ferramentas para agentes de IA
  #  Expõe todos os endpoints da API via protocolo MCP (stdio).
  #  Usado por Claude Desktop, Cursor, e outros clientes MCP.
  # ════════════════════════════════════════════════════════
  mcp:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: microverdes-mcp
    restart: unless-stopped
    environment:
      API_BASE_URL: "http://server:3000"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - microverdes
    stdin_open: true
    tty: true
    logging: *common-logging

  # ════════════════════════════════════════════════════════
  #  3. Greenhouse — Dashboard React via Nginx
  #  Serve o build estático e proxia /api/* para o server
  # ════════════════════════════════════════════════════════
  greenhouse:
    build:
      context: ./greenhouse
      dockerfile: Dockerfile
    container_name: microverdes-greenhouse
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - microverdes
    # Healthcheck desabilitado: Nginx Alpine tem problema conhecido
    # com healthcheck do Docker (IPv6 localhost resolution).
    # O Nginx responde normalmente na porta 8080.
    # healthcheck:
    logging: *common-logging
